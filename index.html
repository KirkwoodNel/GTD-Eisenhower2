<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTD Eisenhower 1-3-5</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif}
  :root{
    --q1:#ff6b6b; --q2:#4ecdc4; --q3:#ffe066; --q4:#95a5a6;
    --gtd-inbox:#9b59b6; --gtd-next:#27ae60; --gtd-wait:#3498db;
    --gtd-someday:#95a5a6; --gtd-done:#2ecc71;
    --bg:#f8f9fa; --card:#fff; --text:#2d3436; --muted:#636e72;
    --shadow:0 4px 20px rgba(0,0,0,.08); --radius:14px;
    --done:#b2bec3; --score-high:#e74c3c; --score-med:#f39c12; --score-low:#27ae60;
  }
  body{background:linear-gradient(135deg,#e3f2fd,#f3e5f5);min-height:100vh;padding:16px}
  .container{max-width:1200px;margin:0 auto}
  h1{text-align:center;color:#2d3436;margin-bottom:8px;font-size:1.7rem}
  .subtitle{text-align:center;color:#636e72;margin-bottom:20px;font-size:0.9rem}

  .recommend{background:linear-gradient(135deg,#fff9c4,#fff3e0);border-left:5px solid #ff9800;padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .recommend h2{font-size:1.1rem;color:#e65100;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .top-task{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px;border-left:4px solid var(--score-high);cursor:pointer;transition:transform .15s,box-shadow .15s}
  .top-task:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .score-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:0.8rem;margin-left:8px;color:#fff}
  .score-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .score-item{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .score-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .score-value{font-weight:700;font-size:1rem}
  .score-high{color:var(--score-high)}
  .score-med{color:var(--score-med)}
  .score-low{color:var(--score-low)}

  .form-container{background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
  .create-task-btn{width:100%;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:15px;border-radius:14px;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(108,92,231,.35);letter-spacing:.2px}
  .create-task-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(108,92,231,.45)}
  .create-task-icon{font-size:1.2rem;font-weight:700;line-height:1}
  .form-container.expanded .create-task-btn{display:none}
  .form-body{max-height:0;opacity:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease}
  .form-container.expanded .form-body{max-height:2400px;opacity:1;padding-top:4px}
  .form-title{font-size:1rem;margin-bottom:14px;color:#555;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .edit-indicator{background:#6c5ce7;color:#fff;padding:4px 10px;border-radius:20px;font-size:0.75rem}
  .cancel-btn{background:none;border:none;color:#e17055;cursor:pointer;font-size:0.9rem;margin-left:auto}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .form-group{display:flex;flex-direction:column;gap:4px}
  label{font-size:0.8rem;font-weight:600;color:#444;margin-left:2px}
  input,select,button,textarea{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
  input,select,textarea{background:#f7f7fb;border:1px solid #e4e4ee;border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s,background .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#6c5ce7;box-shadow:0 0 0 3px rgba(108,92,231,.15);background:#fff}
  textarea{font-family:inherit;resize:vertical;width:100%}
  button{border:none;cursor:pointer;font-weight:600;transition:.2s}
  .quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick-btn{padding:6px 12px;font-size:0.75rem;font-weight:600;border-radius:20px;background:#eeecfc;color:#6c5ce7;border:1px solid transparent}
  .quick-btn:hover{background:#e0defc}
  .quick-btn.active{background:#6c5ce7;color:#fff;box-shadow:0 2px 8px rgba(108,92,231,.35)}
  .datetime-card{background:#f7f7fb;border:1px solid #ececf4;border-radius:14px;padding:14px 16px}
  .datetime-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .datetime-row input{flex:1;min-width:130px;background:#fff}
  .time-input-wrap{flex:1;min-width:130px;display:flex;align-items:stretch;gap:6px}
  .time-input-wrap input{flex:1;min-width:0}
  .time-clear-btn{padding:0 12px;border-radius:10px;background:#fff;border:1px solid #e4e4ee;color:#e17055;font-weight:700}
  .time-clear-btn:hover{background:#fdf1ef}
  .btn-primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;margin-top:8px;border-radius:12px;padding:13px}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-reset{background:#e0e0e0;color:#555;margin-top:8px}

  .section-tabs{display:flex;gap:6px;margin:20px 0 14px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow)}
  .section-tab{flex:1;padding:10px 8px;font-size:0.8rem;font-weight:700;border-radius:10px;background:transparent;color:#888}
  .section-tab:hover{background:#f1f0fe}
  .section-tab.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.35)}
  .gtd-row,.matrix-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
  .list-row{margin-bottom:12px}
  .gtd-row[hidden],.matrix-row[hidden]{display:none}
  .gtd-column,.quadrant{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .gtd-header,.q-header{padding:10px 14px;font-weight:700;color:#fff;font-size:0.9rem}
  .bucket-sort{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(0,0,0,.03);border-bottom:1px solid rgba(0,0,0,.05)}
  .sort-select{flex:1;padding:5px 8px;font-size:0.7rem;font-weight:600;border-radius:8px;background:#fff;border:1px solid #e4e4ee;color:#555}
  .sort-dir-btn{padding:5px 10px;font-size:0.7rem;border-radius:8px;background:#fff;border:1px solid #e4e4ee;color:#6c5ce7}
  .sort-dir-btn:hover{background:#f1f0fe}
  .count-badge{font-weight:600;opacity:0.85;margin-left:3px}
  .total-count{text-align:center;font-weight:700;color:#2d3436;margin-bottom:4px;font-size:1rem}
  .rule135-count{text-align:center;font-weight:600;color:#6c5ce7;margin-bottom:16px;font-size:0.85rem}
  .rule135-popup{position:fixed;top:70px;left:16px;right:16px;margin:0 auto;max-width:480px;z-index:1000;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:12px 14px 12px 18px;border-radius:14px;box-shadow:0 10px 28px rgba(108,92,231,.45);display:flex;align-items:center;gap:12px;font-size:0.85rem;font-weight:600;animation:rule135PopIn .3s ease}
  .rule135-popup[hidden]{display:none}
  .rule135-popup-close{background:rgba(255,255,255,.25);border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:0.75rem;cursor:pointer;flex-shrink:0;margin-left:auto}
  .rule135-popup-close:hover{background:rgba(255,255,255,.4)}
  @keyframes rule135PopIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
  .gtd-inbox .gtd-header{background:var(--gtd-inbox)}
  .gtd-next .gtd-header{background:var(--gtd-next)}
  .gtd-wait .gtd-header{background:var(--gtd-wait)}
  .gtd-someday .gtd-header{background:var(--gtd-someday)}
  .q1 .q-header{background:var(--q1)}
  .q2 .q-header{background:var(--q2)}
  .q3 .q-header{background:var(--q3);color:#2d3436}
  .q4 .q-header{background:var(--q4)}
  .size-big .q-header{background:#4a3f99}
  .size-medium .q-header{background:#6c5ce7}
  .size-small .q-header{background:#a29bfe}

  .task-list{padding:12px;min-height:60px;transition:background .15s,box-shadow .15s;border-radius:8px}
  .task-list.drag-over{background:#eef6ff;box-shadow:inset 0 0 0 2px #6c5ce7}
  .task{padding:10px;border-radius:8px;background:#f8f9fa;margin-bottom:8px;transition:.2s;border-left:4px solid #ddd;cursor:pointer}
  .task:active{transform:scale(0.98)}
  .task.dragging{opacity:.4}
  .task.q1{border-left-color:var(--q1)}
  .task.q2{border-left-color:var(--q2)}
  .task.q3{border-left-color:var(--q3)}
  .task.q4{border-left-color:var(--q4)}
  .task.completed{opacity:.6;border-left-color:var(--done)}
  .task.just-completed{opacity:1;border-left-color:#2ecc71;background:#eafaf1}
  .task.completed .task-text{text-decoration:line-through;color:var(--done)}
  .task.overdue{background:#e74c3c;border-left-color:#c0392b}
  .task.overdue .task-title{color:#fff}
  .task.overdue .task-meta{color:#ffe3e0}
  .task.overdue .meta-tag{background:rgba(255,255,255,.25);color:#fff}
  .task.overdue .meta-tag[href]{color:#fff}
  .task.overdue .meta-tag[href]:hover{background:rgba(255,255,255,.4)}
  .task.overdue .task-notes-preview{color:#ffe3e0}
  .task.overdue .checkbox{border-color:#fff}
  .task.overdue .pill-btn{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
  .task.overdue .delete-btn{color:#fff}
  .task-row{display:flex;align-items:flex-start;gap:8px}
  .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;flex-shrink:0;transition:.2s}
  .checkbox.checked{background:#2ecc71;border-color:#2ecc71;color:#fff}
  .task-text{flex:1}
  .task-title{font-weight:600;margin-bottom:2px;font-size:0.9rem}
  .task-meta{font-size:.7rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .meta-tag{display:inline-flex;align-items:center;gap:2px;padding:2px 5px;border-radius:4px;background:#e9ecef;font-size:0.65rem}
  .meta-tag[href]{text-decoration:none;color:#555;cursor:pointer}
  .meta-tag[href]:hover{background:#d5d9dc}
  .task-notes-preview{font-size:.7rem;color:var(--muted);margin-top:4px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #linkedEmailLink{color:#6c5ce7;font-weight:600;text-decoration:none;font-size:0.85rem}
  #linkedEmailLink:hover{text-decoration:underline}

  .task-actions{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto}
  .pill-row{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
  .pill-btn{padding:3px 9px;font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.2px;border-radius:12px;color:#fff;border:none;cursor:pointer;white-space:nowrap;line-height:1.6}
  .pill-btn:hover{filter:brightness(1.08)}
  .pill-btn.pill-current{display:inline-flex;align-items:center;gap:2px}
  .pill-btn.pill-clear{background:#dfe6e9;color:#636e72}
  .delete-btn{background:none;border:none;color:#e17055;cursor:pointer;font-size:0.9rem;padding:2px;margin-left:auto}
  .empty{text-align:center;color:#b2bec3;padding:16px;font-style:italic;font-size:0.85rem}
  .toggle-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px}
  .toggle-row label{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:#636e72;cursor:pointer;user-select:none}
  .toggle-checkbox{width:16px;height:16px;padding:0;border-radius:4px;accent-color:#6c5ce7}

  @media(max-width:600px){
    .gtd-row,.matrix-row{grid-template-columns:1fr}
    .task-actions{flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:4px;width:100%;justify-content:flex-start}
    .task-row{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div id="rule135Popup" class="rule135-popup" hidden>
  <span id="rule135PopupText"></span>
  <button type="button" class="rule135-popup-close" onclick="dismissRule135Popup()">✕</button>
</div>
<div class="container">
  <h1>GTD Eisenhower 1-3-5</h1>
  <p class="subtitle">Tap any task to edit · Move between sections instantly</p>
  <p id="syncStatus" style="text-align:center;font-size:0.75rem;color:#b2bec3;margin-bottom:12px"></p>
  <p id="totalActiveCount" class="total-count"></p>
  <p id="rule135Count" class="rule135-count"></p>
  <div class="toggle-row">
    <label>
      <input type="checkbox" id="hideCompletedToggle" class="toggle-checkbox" onchange="toggleHideCompleted()">
      🙈 Hide completed tasks
    </label>
  </div>

  <div class="recommend">
    <h2>🎯 What to Do Next — Smart Priority Ranking</h2>
    <div id="recommendPanel"><p style="color:#666">Calculating priorities...</p></div>
  </div>

  <div class="form-container" id="formContainer">
    <button type="button" class="create-task-btn" id="createTaskBtn" onclick="openForm()">
      <span class="create-task-icon">＋</span> Create Task
    </button>
    <div class="form-body" id="formBody">
      <div class="form-title">
        <span id="formMode">➕ Add New Task</span>
        <span id="editBadge" style="display:none" class="edit-indicator">✏️ Editing Task</span>
        <button id="cancelEditBtn" class="cancel-btn" onclick="cancelEdit()">✕ Cancel</button>
      </div>
      <div class="form-grid">
        <div class="form-group" style="grid-column: 1 / -1">
          <label for="taskTitle">📝 Task / Action *</label>
          <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
        </div>
        <div class="form-group">
          <label for="gtdStatus">📂 GTD Status</label>
          <select id="gtdStatus">
            <option value="inbox">📥 Inbox</option>
            <option value="next">▶️ Next Action</option>
            <option value="wait">⏳ Waiting For</option>
            <option value="someday">💭 Someday/Maybe</option>
          </select>
        </div>
        <div class="form-group">
          <label for="priority">🎯 Eisenhower Priority</label>
          <select id="priority">
            <option value="q1">🔴 Q1 — Urgent & Important</option>
            <option value="q2">🔵 Q2 — Not Urgent & Important</option>
            <option value="q3">🟡 Q3 — Urgent & Not Important</option>
            <option value="q4">⚪ Q4 — Not Urgent & Not Important</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskSize">🧠 1-3-5 Size</label>
          <select id="taskSize">
            <option value="">— None —</option>
            <option value="big">🟣 Big · max 1</option>
            <option value="medium">🟪 Medium · max 3</option>
            <option value="small">🔹 Small · max 5</option>
          </select>
        </div>
        <div class="form-group datetime-card" style="grid-column: 1 / -1">
          <label>📅 Due</label>
          <div class="quick-row" data-for="dueDate">
            <button type="button" class="quick-btn" data-kind="today" onclick="setQuickDateKind('dueDate','today')">☀️ Today</button>
            <button type="button" class="quick-btn" data-kind="tomorrow" onclick="setQuickDateKind('dueDate','tomorrow')">🌅 Tomorrow</button>
            <button type="button" class="quick-btn" data-kind="nextweek" onclick="setQuickDateKind('dueDate','nextweek')">📆 Next Week</button>
            <button type="button" class="quick-btn" data-kind="nextmonth" onclick="setQuickDateKind('dueDate','nextmonth')">🗓️ Next Month</button>
          </div>
          <div class="datetime-row">
            <input type="date" id="dueDate" oninput="syncChipActive('dueDate')">
            <div class="time-input-wrap">
              <input type="time" id="dueTime" min="08:00" max="18:00" step="300" onchange="this.value = clampDueTime(this.value)">
              <button type="button" class="time-clear-btn" onclick="clearDueTime()" title="Clear time">✕</button>
            </div>
          </div>
        </div>
        <div class="form-group datetime-card" style="grid-column: 1 / -1">
          <label for="reminderOffset">🔔 Remind me</label>
          <select id="reminderOffset">
            <option value="">No reminder</option>
            <option value="0">At start time</option>
            <option value="5">5 minutes before</option>
            <option value="10">10 minutes before</option>
            <option value="15">15 minutes before</option>
            <option value="30">30 minutes before</option>
            <option value="60">1 hour before</option>
          </select>
        </div>
        <div class="form-group">
          <label for="context">📍 Context</label>
          <input type="text" id="context" placeholder="@Computer, @Phone, @Home">
        </div>
        <div class="form-group" id="linkedEmailGroup" style="display:none;grid-column: 1 / -1">
          <label>🔗 Linked Email</label>
          <a id="linkedEmailLink" href="#" target="_blank" rel="noopener">Open in Outlook ↗</a>
        </div>
        <div class="form-group" style="grid-column: 1 / -1">
          <label for="notes">🗒️ Notes</label>
          <textarea id="notes" rows="3" placeholder="Additional details..."></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-primary" id="saveBtn" onclick="saveTask()">💾 Save Task</button>
      </div>
    </div>
  </div>

  <div class="section-tabs">
    <button type="button" class="section-tab" data-section="gtdRow" onclick="setActiveSection('gtdRow')">📂 GTD Workflow</button>
    <button type="button" class="section-tab" data-section="matrixRow" onclick="setActiveSection('matrixRow')">🎯 Eisenhower Matrix</button>
    <button type="button" class="section-tab" data-section="rule135Row" onclick="setActiveSection('rule135Row')">🧠 1-3-5 Rule</button>
    <button type="button" class="section-tab" data-section="listRow" onclick="setActiveSection('listRow')">📋 List</button>
  </div>
  <div class="gtd-row" id="gtdRow">
    <div class="gtd-column gtd-inbox">
      <div class="gtd-header">📥 Inbox <span class="count-badge" id="count-gtd-inbox"></span></div>
      <div class="bucket-sort">
        <select class="sort-select" id="sortField-gtd-inbox" onchange="setSort('gtd-inbox', this.value)">
          <option value="score">Sort: Score</option>
          <option value="due">Sort: Due Date</option>
        </select>
        <button type="button" class="sort-dir-btn" id="sortDir-gtd-inbox" onclick="toggleSortDir('gtd-inbox')" title="Toggle sort direction">▼</button>
      </div>
      <div class="task-list" id="gtd-inbox" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'gtd-inbox')"></div>
    </div>
    <div class="gtd-column gtd-next">
      <div class="gtd-header">▶️ Next <span class="count-badge" id="count-gtd-next"></span></div>
      <div class="bucket-sort">
        <select class="sort-select" id="sortField-gtd-next" onchange="setSort('gtd-next', this.value)">
          <option value="score">Sort: Score</option>
          <option value="due">Sort: Due Date</option>
        </select>
        <button type="button" class="sort-dir-btn" id="sortDir-gtd-next" onclick="toggleSortDir('gtd-next')" title="Toggle sort direction">▼</button>
      </div>
      <div class="task-list" id="gtd-next" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'gtd-next')"></div>
    </div>
    <div class="gtd-column gtd-wait">
      <div class="gtd-header">⏳ Waiting <span class="count-badge" id="count-gtd-wait"></span></div>
      <div class="bucket-sort">
        <select class="sort-select" id="sortField-gtd-wait" onchange="setSort('gtd-wait', this.value)">
          <option value="score">Sort: Score</option>
          <option value="due">Sort: Due Date</option>
        </select>
        <button type="button" class="sort-dir-btn" id="sortDir-gtd-wait" onclick="toggleSortDir('gtd-wait')" title="Toggle sort direction">▼</button>
      </div>
      <div class="task-list" id="gtd-wait" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'gtd-wait')"></div>
    </div>
    <div class="gtd-column gtd-someday">
      <div class="gtd-header">💭 Someday <span class="count-badge" id="count-gtd-someday"></span></div>
      <div class="bucket-sort">
        <select class="sort-select" id="sortField-gtd-someday" onchange="setSort('gtd-someday', this.value)">
          <option value="score">Sort: Score</option>
          <option value="due">Sort: Due Date</option>
        </select>
        <button type="button" class="sort-dir-btn" id="sortDir-gtd-someday" onclick="toggleSortDir('gtd-someday')" title="Toggle sort direction">▼</button>
      </div>
      <div class="task-list" id="gtd-someday" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'gtd-someday')"></div>
    </div>
  </div>

  <div class="matrix-row" id="matrixRow">
    <div class="quadrant q1">
      <div class="q-header">DO NOW <span class="count-badge" id="count-q1"></span></div>
      <div class="bucket-sort">
        <select class="sort-select" id="sortField-list-q1" onchange="setSort('list-q1', this.value)">
          <option value="score">Sort: Score</option>
          <option value="due">Sort: Due Date</option>
        </select>

<script>
function calculateUrgencyScore(task) {
  let score = 0;
  const priorityWeights = { q1: 40, q2: 25, q3: 15, q4: 5 };
  score += priorityWeights[task.priority] || 0;
  const gtdWeights = { next: 25, inbox: 15, wait: 10, someday: 0 };
  score += gtdWeights[task.gtdStatus] || 0;
  if (task.dueDate) {
    const now = new Date(); now.setHours(0,0,0,0);
    const due = new Date(task.dueDate + 'T00:00:00');
    const daysUntilDue = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
    if (daysUntilDue <= 0) score += 25;
    else if (daysUntilDue <= 1) score += 22;
    else if (daysUntilDue <= 3) score += 18;
    else if (daysUntilDue <= 7) score += 12;
    else if (daysUntilDue <= 14) score += 6;
    else score += 2;
  }
  if (task.dueTime) score += 5;
  if (task.reminderDate || task.reminderTime) score += 5;
  const sizeWeights = { big: 49, medium: 28, small: 13 };
  score += sizeWeights[task.size] || 0;
  return Math.round(score);
}

let tasks = [];
let editingId = null;
let draggedId = null;
let hideCompleted = localStorage.getItem('hideCompleted') === 'true';

// --- Sync with Microsoft To Do via the Cloudflare Worker ---
// WORKER_URL / WORKER_SECRET identify this page to the Worker. Since this is a static public
// page, the "secret" is really just an access token scoped to this one personal task list -
// don't reuse it anywhere sensitive.
const WORKER_URL = 'https://gtd-todo-sync.marknelson.workers.dev';
const WORKER_SECRET = 'vr7Z_03UX1u0-gZCzGDc1_GuDcreVv_c8Et8ouv4I6g';
let syncFailed = false;
let lastSyncTime = null; // ISO string - when the Worker's cron last actually synced with Microsoft To Do

function formatLastSync(isoString) {
  const then = new Date(isoString);
  const diffMin = Math.floor((Date.now() - then.getTime()) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin} min ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  return `${diffDay}d ago`;
}

function updateSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (syncFailed) {
    el.textContent = '⚠️ Not synced with Microsoft To Do right now - working from the copy saved on this device';
    return;
  }
  el.textContent = lastSyncTime
    ? `🔄 Synced with Microsoft To Do · Last synced ${formatLastSync(lastSyncTime)}`
    : '🔄 Synced with Microsoft To Do';
}

async function fetchTasksFromServer() {
  const resp = await fetch(`${WORKER_URL}/api/tasks`, {
    headers: { Authorization: `Bearer ${WORKER_SECRET}` }
  });
  if (!resp.ok) throw new Error(`Worker GET failed: ${resp.status}`);
  const headerLastSync = resp.headers.get('X-Last-Sync');
  if (headerLastSync) lastSyncTime = headerLastSync;
  return resp.json();
}

async function pushTasksToServer() {
  const resp = await fetch(`${WORKER_URL}/api/tasks`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${WORKER_SECRET}` },
    body: JSON.stringify(tasks)
  });
  if (!resp.ok) throw new Error(`Worker PUT failed: ${resp.status}`);
}

async function initTasks() {
  const cached = localStorage.getItem('editStageTodo');
  if (cached) tasks = JSON.parse(cached); // show something instantly while we fetch

  try {
    const serverTasks = await fetchTasksFromServer();
    tasks = serverTasks;
    localStorage.setItem('editStageTodo', JSON.stringify(tasks));
    syncFailed = false; updateSyncStatus();
  } catch (e) {
    console.warn('Could not reach sync server, using local copy only:', e);
    syncFailed = true; updateSyncStatus();
  }
}

// Call this after touching any task's user-facing fields, so the sync job knows the app - not
// Microsoft To Do - now holds the authoritative version.
function markDirty(task) {
  task.lastModified = new Date().toISOString();
  task.source = 'app';
}

async function saveTasks() {
  localStorage.setItem('editStageTodo', JSON.stringify(tasks)); // instant local cache
  try {
    await pushTasksToServer();
    syncFailed = false;
  } catch (e) {
    console.warn('Sync push failed, will retry on next save:', e);
    syncFailed = true;
  }
  updateSyncStatus();
}

// Pick up changes made elsewhere (a flagged email, or an edit in Microsoft To Do) without
// requiring a page reload. Skipped while actively editing so it can't yank the form away.
async function pollServer() {
  if (editingId !== null) return;
  try {
    const serverTasks = await fetchTasksFromServer();
    tasks = serverTasks;
    localStorage.setItem('editStageTodo', JSON.stringify(tasks));
    syncFailed = false; updateSyncStatus();
    renderAll();
  } catch (e) {
    syncFailed = true; updateSyncStatus();
  }
}

function editTask(id) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (!task) return;
  editingId = id;
  document.getElementById('taskTitle').value = task.title;
  document.getElementById('gtdStatus').value = task.gtdStatus;
  document.getElementById('priority').value = task.priority;
  document.getElementById('taskSize').value = task.size || '';
  document.getElementById('dueDate').value = task.dueDate || '';
  document.getElementById('dueTime').value = task.dueTime || '';
  document.getElementById('context').value = task.context || '';
  document.getElementById('notes').value = task.notes || '';
  populateReminderOffset(task);
  if (task.url) {
    document.getElementById('linkedEmailLink').href = task.url;
    document.getElementById('linkedEmailGroup').style.display = '';
  } else {
    document.getElementById('linkedEmailGroup').style.display = 'none';
  }
  document.getElementById('formMode').textContent = `✏️ Editing: "${task.title}"`;
  document.getElementById('editBadge').style.display = 'inline';
  openForm();
  syncChipActive('dueDate');
  document.querySelector('.form-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// The reminder dropdown only offers a fixed set of offsets relative to the due date/time. A
// reminder synced in from elsewhere (or set before this dropdown existed) might not land on
// exactly one of those offsets - in that case we add a one-off "kept as-is" option rather than
// silently discarding it the next time this task is saved.
function populateReminderOffset(task) {
  const select = document.getElementById('reminderOffset');
  const oldKeepOption = select.querySelector('option[value="keep"]');
  if (oldKeepOption) oldKeepOption.remove();

  if (!task.reminderDate && !task.reminderTime) { select.value = ''; return; }
  if (task.dueDate) {
    const dueMs = new Date(`${task.dueDate}T${task.dueTime || '00:00'}:00`).getTime();
    const remMs = new Date(`${task.reminderDate || task.dueDate}T${task.reminderTime || '00:00'}:00`).getTime();
    const diffMin = Math.round((dueMs - remMs) / 60000);
    if (REMINDER_OFFSETS.includes(diffMin)) { select.value = String(diffMin); return; }
  }
  const keepOption = document.createElement('option');
  keepOption.value = 'keep';
  keepOption.textContent = '🔒 Custom reminder (kept as-is)';
  select.insertBefore(keepOption, select.firstChild);
  select.value = 'keep';
}

function openForm() {
  document.getElementById('formContainer').classList.add('expanded');
  document.getElementById('taskTitle').focus();
}

function closeForm() {
  document.getElementById('formContainer').classList.remove('expanded');
}

function cancelEdit() {
  editingId = null;
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskSize').value = '';
  document.getElementById('dueDate').value = '';
  document.getElementById('dueTime').value = '';
  document.getElementById('context').value = '';
  document.getElementById('notes').value = '';

  const keepOption = reminderSelect.querySelector('option[value="keep"]');
  if (keepOption) keepOption.remove();
  reminderSelect.value = '';
  document.getElementById('linkedEmailGroup').style.display = 'none';
  document.getElementById('formMode').textContent = '➕ Add New Task';
  document.getElementById('editBadge').style.display = 'none';
  syncChipActive('dueDate');
  closeForm();
}

// Quick-pick helpers for the date/time inputs above — Apple-style smart chips.
function toISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function startOfNextWeek() {
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() + ((8 - day) % 7 || 7)); // next Monday
  return d;
}
function computeKindValue(kind) {
  const d = new Date();
  if (kind === 'today') return toISODate(d);
  if (kind === 'tomorrow') { d.setDate(d.getDate() + 1); return toISODate(d); }
  if (kind === 'nextweek') return toISODate(startOfNextWeek());
  if (kind === 'nextmonth') { d.setMonth(d.getMonth() + 1); return toISODate(d); }
}
function setQuickDateKind(fieldId, kind) {
  document.getElementById(fieldId).value = computeKindValue(kind);
  syncChipActive(fieldId);
}
function syncChipActive(fieldId) {
  const input = document.getElementById(fieldId);
  document.querySelectorAll(`.quick-row[data-for="${fieldId}"] .quick-btn`).forEach(btn => {
    const target = btn.dataset.kind ? computeKindValue(btn.dataset.kind) : btn.dataset.value;
    btn.classList.toggle('active', !!input.value && input.value === target);
  });
}
function clearDueTime() {
  document.getElementById('dueTime').value = '';
}
// Due time is restricted to 8am-6pm in 5-minute steps. The input's min/max/step attributes
// hint at this in supporting browsers, but typed-in values need clamping too.
function clampDueTime(value) {
  if (!value) return value;
  let [h, m] = value.split(':').map(Number);
  m = Math.round(m / 5) * 5;
  if (m === 60) { m = 0; h += 1; }
  if (h < 8) { h = 8; m = 0; }
  if (h > 18 || (h === 18 && m > 0)) { h = 18; m = 0; }
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// The reminder dropdown stores an offset in minutes before the due date/time.
const REMINDER_OFFSETS = [0, 5, 10, 15, 30, 60];
function computeReminderFromOffset(dueDate, dueTime, offsetMinutes) {
  const base = new Date(`${dueDate}T${dueTime || '00:00'}:00`);
  base.setMinutes(base.getMinutes() - offsetMinutes);
  const reminderTime = `${String(base.getHours()).padStart(2, '0')}:${String(base.getMinutes()).padStart(2, '0')}`;
  return { reminderDate: toISODate(base), reminderTime };
}

function saveTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) return alert('⚠️ Please enter a task!');
  const size = document.getElementById('taskSize').value;
  const checkId = editingId || String(Date.now());
  if (size && !canAssignSize(checkId, size)) { sizeCapAlert(size); return; }
  const dueDate = document.getElementById('dueDate').value;
  const dueTime = clampDueTime(document.getElementById('dueTime').value);
  const reminderOffsetValue = document.getElementById('reminderOffset').value;
  if (reminderOffsetValue !== '' && reminderOffsetValue !== 'keep' && !dueDate) {
    return alert('⚠️ Set a due date first to add a reminder.');
  }
  const taskData = {
    title,
    gtdStatus: document.getElementById('gtdStatus').value,
    priority: document.getElementById('priority').value,
    size: size || undefined,
    dueDate,
    dueTime,
    context: document.getElementById('context').value.trim(),
    notes: document.getElementById('notes').value.trim()
  };
  if (reminderOffsetValue === 'keep') {
    // Leave the task's existing reminderDate/reminderTime/reminderOffsetMinutes untouched.
  } else if (reminderOffsetValue === '') {
    taskData.reminderDate = '';
    taskData.reminderTime = '';
    taskData.reminderOffsetMinutes = undefined;
  } else {
    const offset = parseInt(reminderOffsetValue, 10);
    const computed = computeReminderFromOffset(dueDate, dueTime, offset);
    taskData.reminderDate = computed.reminderDate;
    taskData.reminderTime = computed.reminderTime;
    taskData.reminderOffsetMinutes = offset;
  }
  if (editingId) {
    const idx = tasks.findIndex(t => String(t.id) === String(editingId));
    if (idx !== -1) { tasks[idx] = { ...tasks[idx], ...taskData }; markDirty(tasks[idx]); }
  } else {
    const task = { id: checkId, ...taskData, completed: false };
    markDirty(task);
    tasks.unshift(task);
  }
  saveTasks(); renderAll(); cancelEdit();
}

function moveToGTD(id, newStatus) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (task) { task.gtdStatus = newStatus; markDirty(task); saveTasks(); delete expandedPills[id]; renderAll(); }
}
function moveToPriority(id, newPriority) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (task) { task.priority = newPriority; markDirty(task); saveTasks(); delete expandedPills[id]; renderAll(); }
}
const SIZE_CAPS = { big: 1, medium: 3, small: 5 };
function canAssignSize(id, newSize) {
  if (!newSize) return true;
  const inUse = tasks.filter(t => !t.completed && t.size === newSize && String(t.id) !== String(id)).length;
  return inUse < SIZE_CAPS[newSize];
}
function sizeCapAlert(newSize) {
  alert(`⚠️ The ADHD 1-3-5 rule allows at most ${SIZE_CAPS[newSize]} "${newSize}" task${SIZE_CAPS[newSize] > 1 ? 's' : ''} at a time. Finish or reassign one first.`);
}

// --- Pop-up reminder when a 1-3-5 bucket has spare room ---
let dismissedRule135Signature = null;
function checkRule135Popup(counts) {
  const gaps = [];
  if (counts.big < SIZE_CAPS.big) gaps.push(`${SIZE_CAPS.big - counts.big} Big`);
  if (counts.medium < SIZE_CAPS.medium) gaps.push(`${SIZE_CAPS.medium - counts.medium} Medium`);
  if (counts.small < SIZE_CAPS.small) gaps.push(`${SIZE_CAPS.small - counts.small} Small`);
  const popup = document.getElementById('rule135Popup');
  if (gaps.length === 0) {
    popup.hidden = true;
    dismissedRule135Signature = null; // any future gap should pop up fresh
    return;
  }
  const signature = `${counts.big}|${counts.medium}|${counts.small}`;
  if (dismissedRule135Signature === signature) {
    popup.hidden = true;
    return;
  }
  popup.dataset.signature = signature;
  document.getElementById('rule135PopupText').textContent =
    `🧠 1-3-5 rule: you have room for ${gaps.join(' + ')} more — add one?`;
  popup.hidden = false;
}
function dismissRule135Popup() {
  const popup = document.getElementById('rule135Popup');
  dismissedRule135Signature = popup.dataset.signature || null;
  popup.hidden = true;
}
function moveToSize(id, newSize) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (!task) return;
  if (task.size !== newSize && !canAssignSize(id, newSize)) {
    sizeCapAlert(newSize);
    delete expandedPills[id];
    renderAll();
    return;
  }
  task.size = newSize || undefined; markDirty(task); saveTasks(); delete expandedPills[id]; renderAll();
}

// --- Per-task pill controls: 2 (later 3) collapsed pills that expand to show all options ---
let expandedPills = {}; // { taskId: 'gtd' | 'priority' | 'size' }
function togglePill(id, dim, event) {
  event.stopPropagation();
  expandedPills[id] = expandedPills[id] === dim ? null : dim;
  renderAll();
}
const GTD_META = {
  inbox: { label: 'Inbox', color: 'var(--gtd-inbox)' },
  next: { label: 'Next', color: 'var(--gtd-next)' },
  wait: { label: 'Waiting', color: 'var(--gtd-wait)' },
  someday: { label: 'Someday', color: 'var(--gtd-someday)' }
};
const PRIORITY_META = {
  q1: { label: 'Do Now', color: 'var(--q1)' },
  q2: { label: 'Schedule', color: 'var(--q2)' },
  q3: { label: 'Delegate', color: 'var(--q3)', text: '#2d3436' },
  q4: { label: 'Eliminate', color: 'var(--q4)' }
};
const SIZE_META = {
  big: { label: 'Big · 1', color: '#4a3f99' },
  medium: { label: 'Medium · 3', color: '#6c5ce7' },
  small: { label: 'Small · 5', color: '#a29bfe' }
};
const SIZE_UNSET = { label: 'Size?', color: '#dfe6e9', text: '#636e72' };

function renderPillGroup(taskId, dim, currentKey, meta, unsetMeta, moveFn, clearLabel) {
  const current = meta[currentKey] || unsetMeta;
  if (expandedPills[taskId] !== dim) {
    const style = `background:${current.color};${current.text ? `color:${current.text}` : ''}`;
    return `<button type="button" class="pill-btn pill-current" style="${style}" onclick="togglePill('${taskId}','${dim}',event)">${current.label} ▾</button>`;
  }
  const optionButtons = Object.entries(meta).map(([key, m]) => {
    const style = `background:${m.color};${m.text ? `color:${m.text}` : ''}`;
    return `<button type="button" class="pill-btn" style="${style}" onclick="event.stopPropagation();${moveFn}('${taskId}','${key}')">${m.label}</button>`;
  }).join('');
  const clearButton = clearLabel
    ? `<button type="button" class="pill-btn pill-clear" onclick="event.stopPropagation();${moveFn}('${taskId}','')">${clearLabel}</button>`
    : '';
  return optionButtons + clearButton;
}

// --- Drag & drop between GTD columns / Eisenhower quadrants (desktop mouse drag) ---
function handleDragStart(e, id) {
  draggedId = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch (err) {}
  e.target.classList.add('dragging');
}
function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.task-list.drag-over').forEach(el => el.classList.remove('drag-over'));
  draggedId = null;
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e, targetListId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = draggedId || e.dataTransfer.getData('text/plain');
  draggedId = null;
  if (!id) return;
  if (targetListId.startsWith('gtd-')) {
    moveToGTD(id, targetListId.slice(4));
  } else if (targetListId.startsWith('list-')) {
    moveToPriority(id, targetListId.slice(5));
  } else if (targetListId.startsWith('size-')) {
    moveToSize(id, targetListId.slice(5));
  }
}

function toggleComplete(id, checkboxEl) {
  const task = tasks.find(t => String(t.id) === String(id));
  if (!task) return;
  const becomingComplete = !task.completed;
  task.completed = becomingComplete;
  markDirty(task);
  saveTasks();

  const taskEl = checkboxEl ? checkboxEl.closest('.task') : null;
  if (becomingComplete && taskEl) {
    // Give instant visual feedback (checked box, green flash) and hold for a beat before the
    // list re-renders - otherwise a completed task can vanish the instant it's checked.
    taskEl.classList.add('completed', 'just-completed');
    checkboxEl.classList.add('checked');
    checkboxEl.textContent = '✓';
    setTimeout(renderAll, 2000);
  } else {
    renderAll();
  }
}
function deleteTask(id) {
  if (confirm('Delete this task?')) { tasks = tasks.filter(t => String(t.id) !== String(id)); saveTasks(); renderAll(); }
}
function formatDateDisplay(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function getScoreClass(score) {
  if (score >= 60) return 'score-high';
  if (score >= 40) return 'score-med';
  return 'score-low';
}
function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

function renderRecommendations() {
  const active = tasks.filter(t => !t.completed);
  const scored = active.map(t => ({ ...t, score: calculateUrgencyScore(t) })).sort((a, b) => b.score - a.score);
  const panel = document.getElementById('recommendPanel');
  if (scored.length === 0) {
    panel.innerHTML = '<p style="text-align:center;color:#27ae60;font-weight:600">🎉 All done! Add tasks above.</p>';
    return;
  }
  const top = scored[0];
  const scoreColor = top.score >= 60 ? 'var(--score-high)' : top.score >= 40 ? 'var(--score-med)' : 'var(--score-low)';
  panel.innerHTML = `
    <div class="top-task" onclick="editTask('${top.id}')">
      <strong style="font-size:1rem">🏆 #1 Recommended:</strong>
      <div style="font-size:1rem;margin:6px 0;font-weight:600">${top.title}
        <span class="score-badge" style="background:${scoreColor}">${top.score}/149</span>
      </div>
      <div style="font-size:0.8rem;color:#666">
        ${top.context?`📍 ${top.context}`:''}
        ${top.dueDate?` | 📅 Due: ${formatDateDisplay(top.dueDate)} ${top.dueTime||''}`:''}
        <br><em>Priority: ${top.priority.toUpperCase()} · Status: ${top.gtdStatus}</em>
      </div>
    </div>
    <div style="margin-top:10px">
      <strong>📊 Full Ranking:</strong>
      <div class="score-list">
        ${scored.slice(1,5).map((t,i) => `
          <div class="score-item" onclick="editTask('${t.id}')">
            <span>${i+2}. ${t.title}</span>
            <span class="score-value ${getScoreClass(t.score)}">${t.score}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <p style="font-size:0.7rem;color:#888;margin-top:8px">
      💡 <strong>Tap any task to edit it</strong> · Use small buttons on tasks to move between sections
    </p>
  `;
}

function isOverdue(task) {
  if (task.completed || !task.dueDate) return false;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return new Date(task.dueDate + 'T00:00:00') < now;
}

function taskHTML(task) {
  const score = calculateUrgencyScore(task);
  const overdue = isOverdue(task);
  return `
    <div class="task ${task.priority} ${task.completed?'completed':''} ${overdue?'overdue':''}" draggable="true" ondragstart="handleDragStart(event,'${task.id}')" ondragend="handleDragEnd(event)" onclick="editTask('${task.id}')">
      <div class="task-row">
        <div class="checkbox ${task.completed?'checked':''}" draggable="false" onclick="event.stopPropagation();toggleComplete('${task.id}', this)">
          ${task.completed?'✓':''}
        </div>
        <div class="task-text">
          <div class="task-title">${task.title}
            <span style="font-size:0.65rem;opacity:0.5;margin-left:4px">${score}pts</span>
          </div>
          <div class="task-meta">
            ${task.dueDate?`<span class="meta-tag">📅 ${formatDateDisplay(task.dueDate)} ${task.dueTime||''}</span>`:''}
            ${task.context?`<span class="meta-tag">📍 ${task.context}</span>`:''}
            ${task.url?`<a class="meta-tag" href="${task.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 Email</a>`:''}
          </div>
          ${task.notes?`<div class="task-notes-preview">🗒️ ${truncate(task.notes, 80)}</div>`:''}
        </div>
        <div class="task-actions" draggable="false" onclick="event.stopPropagation()">
          <div class="pill-row">${renderPillGroup(task.id, 'gtd', task.gtdStatus, GTD_META, null, 'moveToGTD')}</div>
          <div class="pill-row">${renderPillGroup(task.id, 'priority', task.priority, PRIORITY_META, null, 'moveToPriority')}</div>
          <div class="pill-row">${renderPillGroup(task.id, 'size', task.size, SIZE_META, SIZE_UNSET, 'moveToSize', 'Clear')}</div>
          <button class="delete-btn" title="Delete" onclick="deleteTask('${task.id}')">🗑️</button>
        </div>
      </div>
    </div>
  `;
}

function toggleHideCompleted() {
  hideCompleted = document.getElementById('hideCompletedToggle').checked;
  localStorage.setItem('hideCompleted', hideCompleted);
  renderAll();
}

// --- Section tabs: only one of GTD Workflow / Eisenhower Matrix / 1-3-5 Rule is shown at a time ---
const ALL_SECTIONS = ['gtdRow', 'matrixRow', 'rule135Row', 'listRow'];
let activeSection = localStorage.getItem('activeSection') || 'gtdRow';
if (!ALL_SECTIONS.includes(activeSection)) activeSection = 'gtdRow';
function setActiveSection(id) {
  activeSection = id;
  localStorage.setItem('activeSection', id);
  applyActiveSection();
}
function applyActiveSection() {
  ALL_SECTIONS.forEach(id => { document.getElementById(id).hidden = id !== activeSection; });
  document.querySelectorAll('.section-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.section === activeSection);
  });
}

// --- Per-bucket sorting (Score or Due Date, ascending or descending) ---
let bucketSort = JSON.parse(localStorage.getItem('bucketSort') || '{}');
const ALL_BUCKETS = ['gtd-inbox','gtd-next','gtd-wait','gtd-someday','list-q1','list-q2','list-q3','list-q4','size-big','size-medium','size-small','list-all'];
function getBucketSort(bucket) {
  if (!bucketSort[bucket]) bucketSort[bucket] = { field: 'score', dir: 'desc' };
  return bucketSort[bucket];
}
function setSort(bucket, field) {
  getBucketSort(bucket).field = field;
  localStorage.setItem('bucketSort', JSON.stringify(bucketSort));
  renderAll();
}
function toggleSortDir(bucket) {
  const s = getBucketSort(bucket);
  s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  localStorage.setItem('bucketSort', JSON.stringify(bucketSort));
  renderAll();
}
function syncSortUI(bucket) {
  const { field, dir } = getBucketSort(bucket);
  const sel = document.getElementById(`sortField-${bucket}`);
  if (sel) sel.value = field;
  const btn = document.getElementById(`sortDir-${bucket}`);
  if (btn) {
    btn.textContent = dir === 'asc' ? '▲' : '▼';
    btn.title = dir === 'asc' ? 'Ascending — tap for descending' : 'Descending — tap for ascending';
  }
}
function sortTasksForBucket(bucket, list) {
  const { field, dir } = getBucketSort(bucket);
  const sign = dir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => {
    if (field === 'score') return sign * (calculateUrgencyScore(a) - calculateUrgencyScore(b));
    // Due date: tasks without one always sort to the end, regardless of direction.
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    const aKey = a.dueDate + (a.dueTime || '00:00');
    const bKey = b.dueDate + (b.dueTime || '00:00');
    return sign * (aKey < bKey ? -1 : aKey > bKey ? 1 : 0);
  });
}

function renderAll() {
  renderRecommendations();
  const visible = hideCompleted ? tasks.filter(t => !t.completed) : tasks;

  const activeCount = tasks.filter(t => !t.completed).length;
  document.getElementById('totalActiveCount').textContent = `📋 ${activeCount} task${activeCount === 1 ? '' : 's'} not complete`;

  const active = tasks.filter(t => !t.completed);
  const big = active.filter(t => t.size === 'big').length;
  const medium = active.filter(t => t.size === 'medium').length;
  const small = active.filter(t => t.size === 'small').length;
  document.getElementById('rule135Count').innerHTML =
    `🎯 1-3-5 Focus: <strong>${big}/1</strong> Big · <strong>${medium}/3</strong> Medium · <strong>${small}/5</strong> Small`;
  checkRule135Popup({ big, medium, small });

  ['inbox','next','wait','someday'].forEach(bin => {
    const bucket = `gtd-${bin}`;
    const filtered = sortTasksForBucket(bucket, visible.filter(t => t.gtdStatus === bin));
    const activeInBin = tasks.filter(t => t.gtdStatus === bin && !t.completed).length;
    document.getElementById(`count-gtd-${bin}`).textContent = `(${activeInBin})`;
    document.getElementById(bucket).innerHTML = filtered.length ? filtered.map(taskHTML).join('') : '<p class="empty">All clear ✅</p>';
  });
  ['q1','q2','q3','q4'].forEach(q => {
    const bucket = `list-${q}`;
    const filtered = sortTasksForBucket(bucket, visible.filter(t => t.priority === q));
    const activeInQ = tasks.filter(t => t.priority === q && !t.completed).length;
    document.getElementById(`count-${q}`).textContent = `(${activeInQ})`;
    document.getElementById(bucket).innerHTML = filtered.length ? filtered.map(taskHTML).join('') : '<p class="empty">No tasks ✅</p>';
  });
  ['big','medium','small'].forEach(sz => {
    const bucket = `size-${sz}`;
    const filtered = sortTasksForBucket(bucket, visible.filter(t => t.size === sz));
    const activeInSz = tasks.filter(t => t.size === sz && !t.completed).length;
    document.getElementById(`count-${bucket}`).textContent = `(${activeInSz})`;
    document.getElementById(bucket).innerHTML = filtered.length ? filtered.map(taskHTML).join('') : '<p class="empty">No tasks ✅</p>';
  });
  {
    const filtered = sortTasksForBucket('list-all', visible);
    document.getElementById('list-all').innerHTML = filtered.length ? filtered.map(taskHTML).join('') : '<p class="empty">No tasks ✅</p>';
  }
  ALL_BUCKETS.forEach(syncSortUI);
}

function checkReminders() {
  const now = new Date();
  tasks.forEach(task => {
    if (!task.completed && task.reminderDate) {
      const remTime = new Date(`${task.reminderDate}T${task.reminderTime||'00:00'}`);
      if (now >= remTime && now - remTime < 60000 && Notification.permission === 'granted') {
        new Notification('🔔 Reminder', { body: task.title, icon: '🔔' });
      }
    }
  });
}
if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();

document.getElementById('hideCompletedToggle').checked = hideCompleted;
applyActiveSection();
initTasks().then(renderAll);
setInterval(checkReminders, 30000);
setInterval(pollServer, 60000);
setInterval(updateSyncStatus, 30000); // keep "Last synced X ago" text fresh between polls
</script>
</body>
</html>
